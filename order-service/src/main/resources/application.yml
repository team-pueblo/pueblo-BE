spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 64KB
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,orders

pueblo:
  orders:
    enabled: ${ORDER_FLOW_ENABLED:false}
    member-url: ${ORDER_MEMBER_URL:http://localhost:8081}
    catalog-url: ${ORDER_CATALOG_URL:http://localhost:8082}
    inventory-secret: ${INVENTORY_COMMAND_SECRET:}
    terms-version: ${ORDER_TERMS_VERSION:purchase-v1}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
  messaging:
    enabled: true
    poll-interval-ms: 1000
    max-per-poll: 10
    lease-ms: 30000
    send-timeout-ms: 6000
    max-attempts: 20
    retry-base-ms: 1000
    retry-max-ms: 30000

# Explicit opt-in: development Compose enables this; production stays disabled.
springdoc:
  api-docs:
    enabled: ${PUEBLO_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${PUEBLO_DOCS_ENABLED:false}
    disable-swagger-default-url: true
    persist-authorization: false
    with-credentials: true
    validator-url: ""
  paths-to-match: /api/v1/**
  override-with-generic-response: false
