# Local development defaults. Compose supplies container addresses through environment variables.
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:local_redis_only}
      ssl:
        enabled: ${REDIS_SSL:false}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/pueblo_member?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:pueblo_member}
    password: ${DB_PASSWORD:local_member_only}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
pueblo:
  docs:
    enabled: true
  auth:
    redis-namespace: ${AUTH_REDIS_NAMESPACE:pueblo:local:member:security:v1}
    jwt-token: ${JWT_TOKEN}
    mail-key-location: ${AUTH_MAIL_KEY_LOCATION:file:${AUTH_KEY_DIRECTORY:../.local/auth}/mail.key}
    cookie-secure: false
    frontend-base-url: ${AUTH_FRONTEND_BASE_URL:http://localhost:5173}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
    mail-mode: smtp
    mail-from: ${SMTP_USERNAME:}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
