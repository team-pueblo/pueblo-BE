spring:
  application:
    name: member-service
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: member-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 64KB
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

pueblo:
  messaging:
    enabled: true
    poll-interval-ms: 1000
    max-per-poll: 10
    lease-ms: 30000
    send-timeout-ms: 6000
    max-attempts: 20
    retry-base-ms: 1000
    retry-max-ms: 30000
  auth:
    mail-mode: smtp
    mail-from: ${SMTP_USERNAME:}
    redis-namespace: ${AUTH_REDIS_NAMESPACE}
    jwt-token: ${JWT_TOKEN}
    mail-key-location: ${AUTH_MAIL_KEY_LOCATION}
    frontend-base-url: ${AUTH_FRONTEND_BASE_URL:https://localhost}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}

# Explicit opt-in: development Compose enables this; production stays disabled.
springdoc:
  api-docs:
    enabled: ${PUEBLO_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${PUEBLO_DOCS_ENABLED:false}
    disable-swagger-default-url: true
    persist-authorization: false
    with-credentials: true
    validator-url: ""
  paths-to-match: /api/v1/**
  override-with-generic-response: false
