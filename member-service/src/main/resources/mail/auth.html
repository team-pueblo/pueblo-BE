<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>pueblo · {{title}}</title></head>
<body style="margin:0;padding:0;background-color:#ffffff;color:#111111;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{description}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#ffffff;table-layout:fixed;">
    <tr><td align="left" style="padding:24px 20px;">
      <table role="presentation" align="left" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;table-layout:fixed;word-wrap:break-word;">
        <tr><td style="padding-bottom:20px;"><img src="cid:pueblo-logo" alt="pueblo" width="140" height="70" style="display:block;width:140px;height:70px;border:0;"></td></tr>
        <tr><td style="padding-bottom:20px;border-bottom:2px solid #111111;"><h1 style="margin:0;font-size:28px;line-height:38px;font-weight:700;letter-spacing:-1px;">{{title}}</h1></td></tr>
        <tr><td style="padding:28px 0 10px;font-size:16px;line-height:26px;font-weight:700;">{{intro}}</td></tr>
        <tr><td style="padding-bottom:32px;font-size:14px;line-height:24px;">{{description}}</td></tr>
        <tr><td>
          <table width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid #eeeeee;border-collapse:collapse;">
            <tr><th colspan="2" align="left" style="padding:18px 20px;background-color:#f2f2f2;font-size:14px;line-height:22px;">인증 안내</th></tr>
            <tr><th scope="row" align="left" style="width:96px;padding:18px 20px;border-bottom:1px solid #eeeeee;font-size:13px;line-height:22px;">유효시간</th><td style="padding:18px 20px;border-bottom:1px solid #eeeeee;font-size:13px;line-height:22px;color:#666666;">{{lifetime}}</td></tr>
            <tr><th scope="row" align="left" style="padding:18px 20px;font-size:13px;line-height:22px;">사용 안내</th><td style="padding:18px 20px;font-size:13px;line-height:22px;color:#666666;">링크는 한 번만 사용할 수 있습니다.</td></tr>
          </table>
        </td></tr>
        <tr><td style="padding-top:24px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td align="center" bgcolor="#0078ff" style="background-color:#0078ff;mso-padding-alt:6px 20px;"><a href="{{link}}" style="display:block;padding:6px 20px;color:#ffffff;font-size:12px;line-height:20px;font-weight:700;text-align:center;text-decoration:none;">{{action}}</a></td></tr></table>
        </td></tr>
        <tr><td style="padding-top:24px;font-size:12px;line-height:20px;color:#777777;">버튼이 작동하지 않으면 아래 주소를 복사해 브라우저에서 열어 주세요.<br><a href="{{link}}" style="color:#666666;text-decoration:underline;word-break:break-all;overflow-wrap:anywhere;">{{link}}</a></td></tr>
        <tr><td style="padding:36px 0 24px;font-size:13px;line-height:22px;">{{note}}</td></tr>
        <tr><td style="border-top:1px solid #eeeeee;padding-top:18px;font-size:11px;line-height:19px;color:#888888;">본 메일은 발신 전용입니다.<br>© pueblo. All rights reserved.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
