INVALID_INPUT=요청 값을 확인해 주세요.
CONSENT_REQUIRED=필수 약관 버전을 확인해 주세요.
INVALID_CREDENTIALS=인증 정보를 확인해 주세요.
REFRESH_REUSE_DETECTED=다시 로그인해 주세요.
ACCESS_DENIED=요청 권한을 확인해 주세요.
CSRF_INVALID=CSRF 토큰이 없거나 올바르지 않습니다. CSRF 토큰을 발급받아 쿠키와 X-XSRF-TOKEN 헤더를 함께 전송해 주세요.
NOT_FOUND=요청한 항목을 찾을 수 없습니다.
METHOD_NOT_ALLOWED=지원하지 않는 요청 메서드입니다.
NOT_ACCEPTABLE=지원하지 않는 응답 형식입니다.
EMAIL_ALREADY_EXISTS=이미 사용 중인 이메일입니다.
EMAIL_ALREADY_VERIFIED=이미 이메일 인증이 완료된 계정입니다. 로그인해 주세요.
REFRESH_ALREADY_ROTATED=갱신이 이미 처리되었습니다.
TOKEN_EXPIRED_OR_USED=링크가 만료되었거나 사용되었습니다.
PAYLOAD_TOO_LARGE=요청 본문이 너무 큽니다.
UNSUPPORTED_MEDIA_TYPE=지원하지 않는 요청 형식입니다.
RATE_LIMITED=요청이 많습니다. 잠시 후 다시 시도해 주세요.
INTERNAL_ERROR=요청을 처리하지 못했습니다.
AUTH_STORE_UNAVAILABLE=인증 서비스를 일시적으로 사용할 수 없습니다.
